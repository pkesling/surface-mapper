[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-mapper"
version = "0.1.0"
description = "Geospatial surface aggregation + visualization engine (BYOD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "matplotlib>=3.8.0",
  "h3>=4.0.0",
  "ipykernel>=7.2.0",
  "pyvista>=0.47.0",
]
[project.optional-dependencies]
dev = ["pytest>=9.0.2"]
render3d = ["pyvista>=0.44.0"]

[project.scripts]
surface-mapper = "surface_mapper.cli.app:main"
surfm = "surface_mapper.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "network: tests that require network access",
]
